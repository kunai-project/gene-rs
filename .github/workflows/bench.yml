# Fork-only workflow: compares criterion benchmarks of a branch against a
# baseline ref on the same runner. Kept out of upstream PRs on purpose.
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      head:
        description: Branch to benchmark
        required: true
        default: perf/alloc-free-lookup
      base:
        description: Baseline ref
        required: true
        default: main
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # one criterion directory shared by both runs so --baseline finds the saved data
      CRITERION_HOME: ${{ github.workspace }}/criterion
      HEAD_REF: ${{ inputs.head || github.head_ref }}
      BASE_REF: ${{ inputs.base || github.base_ref }}
    steps:
      - name: Checkout head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.HEAD_REF }}
          path: head
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BASE_REF }}
          path: base
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Use the head benchmark harness for both runs
        # the base may lack benchmarks added by the head branch
        run: cp head/gene/benches/engine_benchmark.rs base/gene/benches/engine_benchmark.rs

      # Separate target dirs are required: cargo hashes workspace members by
      # their path relative to the workspace root, so a shared target dir lets
      # the second run silently reuse binaries built from the first checkout.
      - name: Benchmark base
        working-directory: base
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-base
        run: cargo bench -p gene --bench engine_benchmark -- --save-baseline base --noplot

      - name: Benchmark head against base
        working-directory: head
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-head
        run: |
          set -o pipefail
          cargo bench -p gene --bench engine_benchmark -- --baseline base --noplot | tee "$RUNNER_TEMP/bench.txt"

      - name: Job summary
        run: |
          {
            echo "## Criterion: \`$HEAD_REF\` vs \`$BASE_REF\`"
            echo
            echo '```text'
            grep -E '^[a-z-]+/|time:|thrpt:|change:|Performance|No change|within noise' "$RUNNER_TEMP/bench.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload criterion data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-${{ github.run_id }}
          path: criterion
          retention-days: 14
