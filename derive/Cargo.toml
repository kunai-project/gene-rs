[package]
name = "gene_derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Crate providing providing derive macros for gene-rs"
documentation = "https://docs.rs/gene_derive"
repository.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.69"
quote = "1.0.33"
syn = { version = "2.0.39", features = ["full"] }

[dev-dependencies]
gene = { path = "../gene" }
